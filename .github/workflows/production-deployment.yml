name: Deploy to Azure App Service

on:
  push:
    branches:
      - production
      - staging

permissions:  
  id-token: write  # 🔥 Vereist voor OpenID Connect-authenticatie  
  contents: read  # Nodig om repo-inhoud te lezen  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build and publish
        run: dotnet publish -c Release -o ./publish

      - name: Controleer of de publish-map bestaat
        run: ls -R ./publish || echo "Publish map is leeg!"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: ./publish

      - name: Controleer of de artifact is gedownload
        run: ls -R ./publish || echo "Artifact niet gevonden!"

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_PRODUCTION }} \
                          --name ${{ secrets.AZURE_WEBAPP_NAME_PRODUCTION }} \
                          --type zip \
                          --src-path ./publish
